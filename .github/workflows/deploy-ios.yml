name: Deploy iOS

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Deploy to Apple TestFlight"
        required: false
        default: false
        type: boolean
      build_name:
        description: "App Version Name override (e.g. 1.0.0). Defaults to pubspec.yaml / tag"
        required: false
        default: ""
        type: string
      build_number:
        description: "App Build Number override (integer). Defaults to github.run_number"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  deploy:
    uses: exa31/github-workflows/.github/workflows/flutter-ios.yml@main
    with:
      app_name: f-tracker-mobile
      flutter_version: "3.x"
      enable_semantic_release: false
      update_pubspec: false
      build_name: ${{ inputs.build_name || '' }}
      build_number: ${{ inputs.build_number || '' }}
      upload_to_testflight: ${{ inputs.upload_to_testflight || false }}
    secrets:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
